[package]
name = "my-lsm-db"
version = "1.3.0"
edition = "2024"
description = "A small embedded LSM key-value database with a typed entity layer, CAS, transactions, composite indexes, queries/aggregates, and backup/restore."
license = "MIT"
repository = "https://github.com/tobs-code/myLSM-DB"
homepage = "https://github.com/tobs-code/myLSM-DB"
documentation = "https://docs.rs/my-lsm-db"
readme = "README.md"
keywords = ["lsm", "database", "embedded", "key-value", "storage"]
categories = ["database-implementations", "data-structures"]

# Entwicklungs-/Historie-Dokumente werden nicht im veröffentlichten Crate
# ausgeliefert (siehe docs/). README, LICENSE, src, tests, examples schon.
exclude = ["docs/"]

[features]
# Diagnose-Instrumentierung für Benchmark/Analyse. Nur aktiv, wenn der
# Benchmark mit `--features bench-diag` gebaut wird; im normalen Release-Pfad
# ist keiner der Counter überhaupt einkompiliert.
bench-diag = []

[dependencies]
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3.10"

# Admin/Operability-CLI (v1.0): inspect / stats / compact / gc.
[[bin]]
name = "lsm-admin"
path = "src/bin/lsm-admin.rs"

# Nutzerorientiertes Minimalbeispiel (default features, baut immer).
[[example]]
name = "intro"

# Diagnose-Examples: dürfen nur mit ihrem Feature gebaut werden,
# damit `cargo build`/`cargo test` ohne Feature den Produktionspfad sauber
# kompilieren (Prototyp-Code bleibt einkompilierbar-getrennt).
[[example]]
name = "bench"
required-features = ["bench-diag"]

[[example]]
name = "bench-baseline"
required-features = ["bench-diag"]

[[example]]
name = "bench-v9"
required-features = ["bench-diag"]

[[example]]
name = "bench-v9a"
required-features = ["bench-diag"]

[[example]]
name = "bench-v9b"
required-features = ["bench-diag"]

[[example]]
name = "bench-vc"
required-features = ["bench-diag"]

[[example]]
name = "bench-vc2"
required-features = ["bench-diag"]
